name: Test Builds

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.configs.os }}
    strategy:
      matrix:
        configs:
          # Linux
          - os: "ubuntu-latest"
            python-version: "3.8"
          - os: "ubuntu-latest"
            python-version: "3.9"
          - os: "ubuntu-latest"
            python-version: "3.10"

          # Intel-based Mac OSX
          - os: "macos-26-intel"
            python-version: "3.8"
          - os: "macos-26-intel"
            python-version: "3.9"

          # ARM64 Mac OSX
          - os: "macos-latest"
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.configs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.configs.python-version}}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"
      - name: Lint with PyCodeStyle
        run: |
          pycodestyle .
      - name: Run Unit Tests
        run: |
          python -m unittest
      - name: Build a Wheel
        run: |
          python setup.py bdist_wheel
